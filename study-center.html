<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500/30 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 1. Google Web App URL (API Gateway)
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHRshs8rHa5bukXoeI6j6b9gHLk1m6KWv_GVJYEqQo0prK3eZ_6Bn7tzvKh65swkdv/exec"; 
        
        function encodeCSV(val) {
            if (val === null || val === undefined) return '';
            let str = String(val);
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        function App() {
            const [theme, setTheme] = useState(localStorage.getItem('scc_theme') || 'light');
            
            // V4 Secure Auth State (Session Token instead of Password)
            const [userLoggedIn, setUserLoggedIn] = useState(localStorage.getItem('study_user_id') || null);
            const [sessionToken, setSessionToken] = useState(localStorage.getItem('study_session_token') || null);
            const [isRegisterMode, setIsRegisterMode] = useState(false);
            const [loginInput, setLoginInput] = useState('');
            const [passInput, setPassInput] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [authSuccessMsg, setAuthSuccessMsg] = useState('');

            // App Data States
            const [chapters, setChapters] = useState([]);
            const [activeSubject, setActiveSubject] = useState('All Subjects');
            const [activePaper, setActivePaper] = useState('All');
            const [viewMode, setViewMode] = useState('tiles'); 
            const [searchTerm, setSearchTerm] = useState('');
            
            // V4 Advanced Sync Queues
            const [loading, setLoading] = useState(false);
            const [pendingUpdates, setPendingUpdates] = useState({});
            const [syncStatus, setSyncStatus] = useState('synced');
            const [showResetModal, setShowResetModal] = useState(false);
            
            const autoSaveTimerRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('scc_theme', theme);
            }, [theme]);

            useEffect(() => {
                // Security Cleanup: Remove legacy passwords if they exist from V3
                if (localStorage.getItem('study_user_pwd')) {
                    localStorage.removeItem('study_user_pwd');
                    console.log("V4 Security Cleanup: Legacy plaintext/b64 password removed from local storage.");
                }
            }, []);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(''); setAuthSuccessMsg('');
                
                const formattedId = loginInput.trim().replace(/\s+/g, '_');
                if(!/^[A-Za-z0-9_]{3,30}$/.test(formattedId)) {
                    return setAuthError("ID must be 3-30 characters, alphanumeric & underscores only.");
                }
                if(passInput.length < 6) return setAuthError("Password must be at least 6 characters.");

                setAuthLoading(true);

                try {
                    const action = isRegisterMode ? 'register' : 'login';
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: action, userId: formattedId, password: passInput }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    
                    const data = await response.json();
                    
                    if (data.error) throw new Error(data.error);

                    if (isRegisterMode) {
                        setIsRegisterMode(false);
                        setPassInput('');
                        setAuthSuccessMsg("Account securely registered! Please log in.");
                        setAuthLoading(false);
                        return;
                    }

                    // Secure Login Success
                    localStorage.setItem('study_user_id', formattedId);
                    localStorage.setItem('study_session_token', data.sessionToken);
                    setUserLoggedIn(formattedId);
                    setSessionToken(data.sessionToken);
                } catch (error) {
                    setAuthError(error.message || "Connection failed.");
                }
                setAuthLoading(false);
            };

            const handleLogout = () => {
                localStorage.removeItem('study_user_id');
                localStorage.removeItem('study_session_token');
                setUserLoggedIn(null); setSessionToken(null); setChapters([]);
            };

            const fetchWorkspaceData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'fetch', userId: userLoggedIn, sessionToken: sessionToken }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        if (data.error.includes('Session') || data.error.includes('Authentication')) handleLogout();
                        throw new Error(data.error);
                    }
                    
                    setChapters(data.chapters);
                    setSyncStatus('synced');
                } catch (error) {
                    console.error("Fetch Error:", error);
                    setSyncStatus('error');
                }
                setLoading(false);
            };

            useEffect(() => {
                if (userLoggedIn && sessionToken) fetchWorkspaceData();
            }, [userLoggedIn, sessionToken]);

            const executeReset = async () => {
                setShowResetModal(false);
                setLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'reset', userId: userLoggedIn, sessionToken: sessionToken }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);
                    
                    setPendingUpdates({}); 
                    await fetchWorkspaceData(); 
                } catch (error) {
                    console.error("Reset Failed: " + error.message);
                }
                setLoading(false);
            };

            useEffect(() => {
                if (Object.keys(pendingUpdates).length === 0) return;
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                
                // Debounce sync engine
                autoSaveTimerRef.current = setTimeout(() => handleManualSave(), 2500); 
                return () => clearTimeout(autoSaveTimerRef.current);
            }, [pendingUpdates]);

            const handleManualSave = async () => {
                // Snapshot ensures we only clear updates we actually sent to the server
                const snapshotUpdates = { ...pendingUpdates };
                const updatesArray = Object.values(snapshotUpdates);
                
                if (updatesArray.length === 0 || syncStatus === 'saving') return;
                
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                setSyncStatus('saving');

                try {
                    const payload = { action: 'save', userId: userLoggedIn, sessionToken: sessionToken, updates: updatesArray };
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        if (data.error.includes('Session')) handleLogout();
                        throw new Error(data.error);
                    }

                    // Concurrency Handling: Apply server versions and check for conflicts
                    let conflictDetected = false;
                    
                    if (data.saved) {
                        setChapters(prev => prev.map(ch => {
                            if (data.saved[ch.id] !== undefined) return { ...ch, version: data.saved[ch.id] };
                            return ch;
                        }));
                    }
                    
                    if (data.failed && data.failed.length > 0) {
                        console.warn("V4 Sync Engine: Server reported conflicts or invalid IDs:", data.failed);
                        conflictDetected = true;
                    }

                    setPendingUpdates(prev => {
                        const next = { ...prev };
                        for(const key in snapshotUpdates) {
                            // Do not clear the queue if the server explicitly rejected the ID due to strict equality failure
                            if (!data.failed || !data.failed.includes(key)) delete next[key];
                        }
                        return next;
                    });
                    
                    setSyncStatus(conflictDetected ? 'error' : 'synced');
                    
                    // If conflict detected, force a re-fetch to resolve state divergence
                    if (conflictDetected) {
                        console.warn("Forcing workspace refetch due to version conflict.");
                        fetchWorkspaceData();
                    }

                } catch (error) {
                    console.error("Save Error:", error);
                    setSyncStatus('error');
                }
            };

            const updateChapter = (id, field, value) => {
                let chapterVersion = 1;
                
                setChapters(prevChapters => prevChapters.map(ch => {
                    if (ch.id === id) {
                        chapterVersion = ch.version;
                        if (field.includes('.')) {
                            const [parent, child] = field.split('.');
                            return { ...ch, [parent]: { ...ch[parent], [child]: value } };
                        }
                        return { ...ch, [field]: value };
                    }
                    return ch;
                }));

                setPendingUpdates(prevPending => {
                    const currentChapterQueue = prevPending[id] ? { ...prevPending[id] } : { id: id, version: chapterVersion };
                    
                    if (field.includes('.')) {
                        const [parent, child] = field.split('.');
                        currentChapterQueue[parent] = currentChapterQueue[parent] || {};
                        currentChapterQueue[parent][child] = value;
                    } else {
                        currentChapterQueue[field] = value;
                    }
                    return { ...prevPending, [id]: currentChapterQueue };
                });
                
                setSyncStatus('unsaved');
            };

            const handleExportCSV = () => {
                if(chapters.length === 0) return;
                
                const headers = ["id", "subject", "paper", "chapterNo", "titleEn", "titleBn", "status", 
                                 "theory", "textbook", "written", "questionBank", "mistakeCorrection", "conceptBook", "lectureSlide", 
                                 "engMcq", "varsityMcq",
                                 "qbSolved", "revisions", "writtenScore", "mcqScore", "confidence", "version"];
                
                let csvContent = headers.join(',') + '\n';
                
                chapters.forEach(ch => {
                    const safeMilestones = ch.milestones || {};
                    const row = [
                        ch.id, ch.subject, ch.paper, ch.chapterNo, ch.titleEn, ch.titleBn, ch.status,
                        safeMilestones.theory || false, safeMilestones.textbook || false, safeMilestones.written || false, safeMilestones.questionBank || false,
                        safeMilestones.mistakeCorrection || false, safeMilestones.conceptBook || false, safeMilestones.lectureSlide || false,
                        safeMilestones.engMcq || false, safeMilestones.varsityMcq || false,
                        ch.qbSolved || 0, ch.revisions || 0, ch.writtenScore || '', ch.mcqScore || '', ch.confidence || 'Unrated',
                        ch.version || 1
                    ];
                    csvContent += row.map(encodeCSV).join(',') + '\n';
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `StudyData_V4_${userLoggedIn}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const rows = parseCSV(text);
                    if (rows.length < 2) return alert("File is empty or invalid.");

                    const headers = rows[0];
                    if (!headers.includes("id")) return alert("Invalid CSV format. Missing 'id' column.");

                    let newPending = { ...pendingUpdates };
                    let updatedChapters = JSON.parse(JSON.stringify(chapters)); 

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row.length < 2) continue;

                        const rowData = {};
                        headers.forEach((h, idx) => rowData[h] = row[idx]);

                        const chapterIndex = updatedChapters.findIndex(c => String(c.id) === String(rowData.id));
                        if (chapterIndex === -1) continue; 

                        const existing = updatedChapters[chapterIndex];
                        if(!existing.milestones) existing.milestones = {};
                        
                        let chUpdates = {};
                        let hasChanges = false;

                        const checkUpdate = (field, type = 'string') => {
                            let val = rowData[field];
                            if (val === undefined || val === null) return;

                            if (type === 'boolean') val = (String(val).toLowerCase() === 'true');
                            if (type === 'number') val = Number(val) || 0;

                            const milestoneFields = ['theory', 'textbook', 'written', 'questionBank', 'mistakeCorrection', 'conceptBook', 'lectureSlide', 'engMcq', 'varsityMcq'];
                            
                            if (milestoneFields.includes(field)) {
                                if (existing.milestones[field] !== val) {
                                    existing.milestones[field] = val;
                                    if (!chUpdates.milestones) chUpdates.milestones = {};
                                    chUpdates.milestones[field] = val;
                                    hasChanges = true;
                                }
                            } else {
                                if (existing[field] !== val) {
                                    existing[field] = val;
                                    chUpdates[field] = val;
                                    hasChanges = true;
                                }
                            }
                        };

                        checkUpdate('status', 'string'); checkUpdate('theory', 'boolean'); checkUpdate('textbook', 'boolean');
                        checkUpdate('written', 'boolean'); checkUpdate('questionBank', 'boolean'); checkUpdate('mistakeCorrection', 'boolean');
                        checkUpdate('conceptBook', 'boolean'); checkUpdate('lectureSlide', 'boolean'); checkUpdate('engMcq', 'boolean');
                        checkUpdate('varsityMcq', 'boolean'); checkUpdate('qbSolved', 'number'); checkUpdate('revisions', 'number');
                        checkUpdate('writtenScore', 'string'); checkUpdate('mcqScore', 'string'); checkUpdate('confidence', 'string');

                        if (hasChanges) {
                            newPending[existing.id] = { 
                                ...(newPending[existing.id] || { id: existing.id, version: existing.version }), 
                                ...chUpdates 
                            };
                        }
                    }

                    setChapters(updatedChapters);
                    setPendingUpdates(newPending);
                    if (Object.keys(newPending).length > 0) setSyncStatus('unsaved');
                    event.target.value = null;
                };
                reader.readAsText(file);
            };

            const subjectsList = Array.from(new Set(chapters.map(ch => ch.subject))).filter(s => s !== 'Unknown');
            const papersList = activeSubject !== 'All Subjects' ? Array.from(new Set(chapters.filter(c => c.subject === activeSubject).map(c => c.paper))) : [];

            const getSubjectColor = (sub) => {
                switch(sub) {
                    case 'Physics': return 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-700/50';
                    case 'Chemistry': return 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700/50';
                    case 'Higher Math': return 'text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/30 border-sky-200 dark:border-sky-700/50';
                    case 'Biology': return 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border-rose-200 dark:border-rose-700/50';
                    default: return 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            const getHeaderStyle = (sub) => {
                switch(sub) {
                    case 'All Subjects': return 'bg-gradient-to-r from-blue-700 via-indigo-700 to-violet-700 dark:from-blue-900 dark:via-indigo-900 dark:to-violet-900 text-white';
                    case 'Physics': return 'bg-gradient-to-r from-indigo-600 to-indigo-800 dark:from-indigo-900 dark:to-indigo-700 text-white';
                    case 'Chemistry': return 'bg-gradient-to-r from-emerald-600 to-teal-700 dark:from-emerald-900 dark:to-teal-800 text-white';
                    case 'Higher Math': return 'bg-gradient-to-r from-sky-600 to-cyan-700 dark:from-blue-900 dark:to-cyan-800 text-white';
                    case 'Biology': return 'bg-gradient-to-r from-rose-600 to-pink-700 dark:from-rose-900 dark:to-pink-800 text-white';
                    default: return 'bg-gradient-to-r from-slate-600 to-slate-800 dark:from-slate-900 dark:to-slate-700 text-white';
                }
            };

            const filteredChapters = chapters.filter(ch => {
                if (activeSubject !== 'All Subjects' && ch.subject !== activeSubject) return false;
                if (activePaper !== 'All' && ch.paper !== activePaper) return false;
                const searchLower = searchTerm.toLowerCase();
                return ch.titleEn.toLowerCase().includes(searchLower) || ch.titleBn.includes(searchLower);
            });

            const weakTopicsChapters = chapters.filter(ch => ch.confidence === 'Low').sort((a, b) => a.subject.localeCompare(b.subject));
            const weakTopicIds = new Set(weakTopicsChapters.map(c => c.id));
            const inProgressChapters = chapters.filter(ch => ch.status === 'Started' && !weakTopicIds.has(ch.id)).sort((a, b) => a.subject.localeCompare(b.subject));

            if (!userLoggedIn || !sessionToken) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="absolute top-4 right-4">
                            <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow flex items-center justify-center text-slate-600 dark:text-slate-300 transition hover:bg-slate-100 dark:hover:bg-slate-700">
                                {theme === 'dark' ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}
                            </button>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 dark:border-slate-800 relative overflow-hidden transition-colors">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-cyan-500"></div>
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-indigo-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100 dark:border-slate-700">
                                    <i className="fa-solid fa-shield-halved text-3xl text-indigo-600 dark:text-indigo-500"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">SCC Auth V4.1</h1>
                                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Study Command Center</p>
                            </div>

                            {authError && <div className="bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800/50 text-rose-700 dark:text-rose-400 px-4 py-3 rounded-xl text-sm mb-6 flex items-start gap-2"><i className="fa-solid fa-circle-exclamation mt-0.5"></i> {authError}</div>}
                            {authSuccessMsg && <div className="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800/50 text-emerald-700 dark:text-emerald-400 px-4 py-3 rounded-xl text-sm mb-6 flex items-start gap-2"><i className="fa-solid fa-circle-check mt-0.5"></i> {authSuccessMsg}</div>}

                            <form onSubmit={handleAuth} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Username</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                                        <input type="text" required placeholder="Alphanumeric & _" value={loginInput} onChange={e => setLoginInput(e.target.value)} className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl pl-10 pr-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 transition font-medium"/>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                                        <input type={showPass ? "text" : "password"} required placeholder={isRegisterMode ? "Create a password" : "Enter password"} value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl pl-10 pr-10 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 transition font-medium"/>
                                        <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"><i className={`fa-solid ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>
                                </div>
                                <button type="submit" disabled={authLoading} className="w-full bg-indigo-600 text-white rounded-xl py-3.5 font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 dark:shadow-indigo-900/20 disabled:opacity-70 flex items-center justify-center gap-2">
                                    {authLoading ? <><i className="fa-solid fa-spinner fa-spin"></i> Processing...</> : <><i className="fa-solid fa-right-to-bracket"></i> {isRegisterMode ? 'Register' : 'Login'}</>}
                                </button>
                                <div className="text-center mt-4">
                                    <button type="button" onClick={() => {setIsRegisterMode(!isRegisterMode); setAuthError(''); setAuthSuccessMsg('');}} className="text-sm text-indigo-600 dark:text-indigo-400 font-bold hover:underline">
                                        {isRegisterMode ? 'Already registered? Login' : 'Need an account? Register'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-4 text-slate-500 dark:text-slate-300">
                        <i className="fa-solid fa-shield-check text-4xl text-indigo-500 animate-pulse"></i>
                        <p className="font-bold tracking-wider">Verifying Session & Fetching Data...</p>
                    </div>
                );
            }

            return (
                <div className="pb-20 relative min-h-screen transition-colors">
                    {/* RESET CONFIRMATION MODAL */}

                                <button onClick={toggleTheme} className="w-9 h-9 md:w-10 md:h-10 rounded-xl flex items-center justify-center text-slate-500 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 transition">{theme === 'dark' ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}</button>

                            <div className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-2"></div>

                        </div>

                        {/* DASHBOARD VIEW */}
                        {activeSubject === 'All Subjects' && (
                            <div className="space-y-8">
                                <div className={`${getHeaderStyle('All Subjects')} rounded-3xl p-6 md:p-10 text-white shadow-xl relative overflow-hidden`}>
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white dark:bg-indigo-500 opacity-10 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>

                                        <div className="flex items-center gap-3 mb-2 opacity-80 dark:text-indigo-400 dark:opacity-100"><i className="fa-solid fa-earth-americas"></i><span className="text-sm font-medium tracking-wide uppercase">Universal Multi-Subject Master Hub</span></div>
                                        <h1 className="text-3xl md:text-5xl font-extrabold mb-4">Study Command Center</h1>

                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                        {weakTopicsChapters.map(chapter => <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />)}
                                        {weakTopicsChapters.length === 0 && <div className="col-span-full py-6 text-center text-slate-500 font-medium">No low confidence chapters. Great job!</div>}
                                    </div>
                                </div>
                                <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm dark:shadow-lg">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-amber-600 dark:text-amber-500 mb-6 border-b border-slate-100 dark:border-slate-800 pb-4"><i className="fa-solid fa-person-digging"></i> Action Queue: In Progress (Max 6)</h2>

                                            <thead className="bg-slate-100 dark:bg-slate-950 text-slate-500 font-bold uppercase text-[10px] border-b border-slate-200 dark:border-slate-800 tracking-wider">
                                                <tr>
                                                    <th className="px-3 py-4">Chapter</th><th className="px-3 py-4">Status</th>
                                                    <th className="px-3 py-4 text-center">Theory</th><th className="px-3 py-4 text-center">T.Book</th><th className="px-3 py-4 text-center">CQ</th>
                                                    <th className="px-3 py-4 text-center">Mistakes</th><th className="px-3 py-4 text-center">C.Book</th><th className="px-3 py-4 text-center">Slides</th>
                                                    <th className="px-3 py-4 text-center text-blue-500">EngMCQ</th><th className="px-3 py-4 text-center text-blue-500">VarMCQ</th>

                                                        <td className="px-3 py-4"><select value={ch.status} onChange={(e) => updateChapter(ch.id, 'status', e.target.value)} className="text-sm font-bold bg-transparent dark:bg-slate-900 outline-none cursor-pointer text-indigo-700 dark:text-indigo-400 border border-transparent dark:border-slate-700 rounded p-1"><option value="Not Started">Not Started</option><option value="Started">Started</option><option value="Paused">Paused</option><option value="Completed">Completed</option></select></td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.theory', !(ch.milestones?.theory))}>{ch.milestones?.theory ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.textbook', !(ch.milestones?.textbook))}>{ch.milestones?.textbook ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.written', !(ch.milestones?.written))}>{ch.milestones?.written ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.mistakeCorrection', !(ch.milestones?.mistakeCorrection))}>{ch.milestones?.mistakeCorrection ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.conceptBook', !(ch.milestones?.conceptBook))}>{ch.milestones?.conceptBook ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.lectureSlide', !(ch.milestones?.lectureSlide))}>{ch.milestones?.lectureSlide ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg bg-blue-50/30 dark:bg-blue-900/10" onClick={() => updateChapter(ch.id, 'milestones.engMcq', !(ch.milestones?.engMcq))}>{ch.milestones?.engMcq ? <i className="fa-solid fa-circle-check text-blue-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center cursor-pointer text-lg bg-blue-50/30 dark:bg-blue-900/10" onClick={() => updateChapter(ch.id, 'milestones.varsityMcq', !(ch.milestones?.varsityMcq))}>{ch.milestones?.varsityMcq ? <i className="fa-solid fa-circle-check text-blue-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-3 py-4 text-center">
                                                            <div className="flex items-center justify-center gap-3 bg-slate-50 dark:bg-slate-950 p-1.5 rounded-lg border border-slate-200 dark:border-slate-800"><button onClick={() => updateChapter(ch.id, 'qbSolved', Math.max(0, ch.qbSolved - 1))} className="text-slate-400 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold">-</button><span className="font-bold w-4 text-indigo-900 dark:text-indigo-400">{ch.qbSolved}</span><button onClick={() => updateChapter(ch.id, 'qbSolved', ch.qbSolved + 1)} className="text-slate-400 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold">+</button></div>
                                                        </td>
                                                        <td className="px-3 py-4"><select value={ch.confidence} onChange={(e) => updateChapter(ch.id, 'confidence', e.target.value)} className="text-sm font-bold bg-transparent outline-none text-slate-700 dark:text-slate-300"><option value="Unrated">Unrated</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ChapterCard({ chapter, onUpdate, subjectColor }) {
            const { id, subject, paper, chapterNo, titleEn, titleBn, status, milestones, qbSolved, revisions, writtenScore, mcqScore, confidence, version } = chapter;
            const [localWritten, setLocalWritten] = useState(writtenScore || '');
            const [localMcq, setLocalMcq] = useState(mcqScore || '');

            useEffect(() => { setLocalWritten(writtenScore || ''); }, [writtenScore]);
            useEffect(() => { setLocalMcq(mcqScore || ''); }, [mcqScore]);

            const safeMilestones = milestones || {};
            const toggleMilestone = (field) => onUpdate(id, `milestones.${field}`, !safeMilestones[field]);

            const getConfidenceStyle = (conf) => {
                switch(conf) {
                    case 'High': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700/50';
                    case 'Medium': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-700/50';
                    case 'Low': return 'text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border-rose-200 dark:border-rose-700/50';
                    default: return 'text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };
            const getStatusColor = (stat) => {
                switch(stat) {
                    case 'Completed': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-500/50';
                    case 'Started': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-500/50';
                    case 'Paused': return 'text-purple-700 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20 border-purple-200 dark:border-purple-500/50';
                    default: return 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            return (
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm dark:shadow-lg border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden group">
                    <div className="p-5 border-b border-slate-100 dark:border-slate-800/50">
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase border ${subjectColor}`}>{subject}</span>
                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">{paper} • Ch {chapterNo}</span>
                            </div>
                            <span className="text-[10px] text-slate-300 dark:text-slate-600">v{version}</span>
                        </div>

                        <h3 className="font-extrabold text-slate-800 dark:text-white text-lg leading-tight mb-1">{titleEn}</h3>
                        <p className="text-sm font-medium text-slate-500 mb-2">{titleBn}</p>
                        {confidence && confidence !== 'Unrated' && (
                            <span className={`text-[10px] inline-flex font-bold px-2 py-1 rounded items-center gap-1 border ${getConfidenceStyle(confidence)}`}>{confidence === 'Low' && <i className="fa-solid fa-triangle-exclamation"></i>} {confidence} Conf</span>
                        )}
                        
                        <div className="mt-5 flex items-center justify-between bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border border-slate-100 dark:border-slate-800">
                            <span className="text-xs font-bold text-slate-500 ml-2">Status:</span>
                            <select value={status} onChange={(e) => onUpdate(id, 'status', e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border outline-none appearance-none cursor-pointer ${getStatusColor(status)}`}>
                                <option value="Not Started">Not Started</option><option value="Started">Started</option><option value="Paused">Paused</option><option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div className="p-5 bg-slate-50/50 dark:bg-slate-800/20 flex-1">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3">Study Milestones</h4>
                        <div className="grid grid-cols-2 gap-2">
                            <MilestoneCheckbox label="Theory" checked={safeMilestones.theory} onChange={() => toggleMilestone('theory')} />
                            <MilestoneCheckbox label="Textbook" checked={safeMilestones.textbook} onChange={() => toggleMilestone('textbook')} />
                            <MilestoneCheckbox label="Written" checked={safeMilestones.written} onChange={() => toggleMilestone('written')} />
                            <MilestoneCheckbox label="Question Bank" checked={safeMilestones.questionBank} onChange={() => toggleMilestone('questionBank')} />
                            <MilestoneCheckbox label="Mistakes" checked={safeMilestones.mistakeCorrection} onChange={() => toggleMilestone('mistakeCorrection')} />
                            <MilestoneCheckbox label="Concept Book" checked={safeMilestones.conceptBook} onChange={() => toggleMilestone('conceptBook')} />
                            <MilestoneCheckbox label="Lecture Slide" checked={safeMilestones.lectureSlide} onChange={() => toggleMilestone('lectureSlide')} />
                            <MilestoneCheckbox label="Eng. MCQ" checked={safeMilestones.engMcq} onChange={() => toggleMilestone('engMcq')} />
                            <MilestoneCheckbox label="Varsity MCQ" checked={safeMilestones.varsityMcq} onChange={() => toggleMilestone('varsityMcq')} />
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-5">
                            <div className="bg-white dark:bg-slate-900 border border-yellow-100 dark:border-slate-700 rounded-xl p-3"><div className="text-[10px] font-bold text-yellow-600 dark:text-amber-500 uppercase mb-2">QB Solved</div><div className="flex items-center justify-between bg-yellow-50 dark:bg-slate-950 rounded-lg p-1.5 border border-yellow-200/50 dark:border-slate-800"><button onClick={() => onUpdate(id, 'qbSolved', Math.max(0, qbSolved - 1))} className="w-7 h-7 bg-white dark:bg-slate-800 text-yellow-700 dark:text-slate-400 rounded font-bold">-</button><span className="font-extrabold text-yellow-900 dark:text-amber-500 text-lg">{qbSolved}</span><button onClick={() => onUpdate(id, 'qbSolved', qbSolved + 1)} className="w-7 h-7 bg-white dark:bg-slate-800 text-yellow-700 dark:text-slate-400 rounded font-bold">+</button></div></div>
                            <div className="bg-white dark:bg-slate-900 border border-blue-100 dark:border-slate-700 rounded-xl p-3"><div className="text-[10px] font-bold text-blue-600 dark:text-indigo-400 uppercase mb-2">Revisions</div><div className="flex items-center justify-between bg-blue-50 dark:bg-slate-950 rounded-lg p-1.5 border border-blue-200/50 dark:border-slate-800"><button onClick={() => onUpdate(id, 'revisions', Math.max(0, revisions - 1))} className="w-7 h-7 bg-white dark:bg-slate-800 text-blue-700 dark:text-slate-400 rounded font-bold">-</button><span className="font-extrabold text-blue-900 dark:text-indigo-400 text-lg">{revisions}</span><button onClick={() => onUpdate(id, 'revisions', revisions + 1)} className="w-7 h-7 bg-white dark:bg-slate-800 text-blue-700 dark:text-slate-400 rounded font-bold">+</button></div></div>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mt-5 pt-5 border-t border-slate-200/60 dark:border-slate-800">
                            <div><label className="text-[10px] text-slate-500 font-bold block mb-1">Written:</label><input type="text" placeholder="42" value={localWritten} onChange={(e) => setLocalWritten(e.target.value)} onBlur={() => onUpdate(id, 'writtenScore', localWritten)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center" /></div>
                            <div><label className="text-[10px] text-slate-500 font-bold block mb-1">MCQ:</label><input type="text" placeholder="28/30" value={localMcq} onChange={(e) => setLocalMcq(e.target.value)} onBlur={() => onUpdate(id, 'mcqScore', localMcq)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center" /></div>
                            <div><label className="text-[10px] text-slate-500 font-bold block mb-1">Conf:</label><select value={confidence} onChange={(e) => onUpdate(id, 'confidence', e.target.value)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center appearance-none cursor-pointer"><option value="Unrated">-</option><option value="Low">Low</option><option value="Medium">Med</option><option value="High">High</option></select></div>
                        </div>
                    </div>
                </div>
            );
        }

        function MilestoneCheckbox({ label, checked, onChange }) {
            return (
                <div onClick={onChange} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer transition-all ${checked ? 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-500/50 text-indigo-700 dark:text-indigo-400 shadow-inner' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                    {checked ? <i className="fa-solid fa-circle-check text-indigo-600 text-lg"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600 text-lg"></i>}
                    <span className="text-[11px] font-bold leading-none select-none">{label}</span>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
