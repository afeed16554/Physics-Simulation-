<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simple Harmonic Motion | AFEED</title>
    <meta name="description" content="AFEED Physics Simulation - Simple Harmonic Motion">
    
    <!-- Tailwind CSS with Dark Mode Class enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Bengali', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+Bengali:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ======================================================================
           AFEED GLOBAL STYLING
         ====================================================================== */
        :root {
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            /* Allow scrolling for potential future bottom panels */
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Glassmorphism */
        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        html:not(.dark) .glass { background: rgba(255, 253, 250, 0.85); }

        /* Brand Gradient */
        .brand-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .brand-gradient {
            display: inline-block;
            padding-right: 0.08em; 
        }
        .dark .brand-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        html:not(.dark) .brand-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.2); }

        /* Canvas overrides */
        canvas {
            display: block;
            touch-action: none; /* Prevent scroll on canvas drag */
        }

        /* ======================================================================
           REGULAR ACCENT SLIDERS
         ====================================================================== */
        input[type=range].afeed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            outline: none;
            background: #cbd5e1;
            transition: background 0.3s;
        }
        .dark input[type=range].afeed-slider {
            background: #334155; 
        }
        
        input[type=range].afeed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #ea580c; 
            box-shadow: -400px 0 0 390px rgba(234, 88, 12, 0.3); 
            transition: transform 0.1s;
        }
        .dark input[type=range].afeed-slider::-webkit-slider-thumb {
            border-color: #818cf8; 
            box-shadow: -400px 0 0 390px rgba(129, 140, 248, 0.3); 
        }
        
        input[type=range].afeed-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #ea580c;
        }
        .dark input[type=range].afeed-slider::-moz-range-thumb {
            border-color: #818cf8;
        }
        
        .slider-wrapper {
            overflow: hidden;
            border-radius: 10px;
            padding: 8px 0;
        }

        .smooth-transition { transition: all 0.5s var(--ease-smooth); }
    </style>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('afeed_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="bg-[#fffdfa] text-slate-700 dark:bg-slate-950 dark:text-slate-300 transition-colors duration-500 min-h-screen flex flex-col">

            <div class="flex items-center gap-3 md:gap-5">
                <a href="index.html" class="p-2 rounded-xl border border-orange-100 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-orange-50/50 dark:hover:bg-slate-800 text-orange-600 dark:text-slate-400 hover:text-orange-700 dark:hover:text-indigo-400 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-500/30 dark:focus:ring-indigo-500/30" aria-label="Back to Main Menu">

                            </div>

<script>
    // --- UI Setup & OS Theme ---
    function applyThemeIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeIconContainer = document.getElementById('theme-icon-container');
        if (isDark) {
            themeIconContainer.innerHTML = `<i data-lucide="sun" class="w-5 h-5 text-amber-400"></i>`;
        } else {
            themeIconContainer.innerHTML = `<i data-lucide="moon" class="w-5 h-5 text-orange-600"></i>`;
        }
        if(window.lucide) lucide.createIcons();
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        if(isDark) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('afeed_theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('afeed_theme', 'dark');
        }
        applyThemeIcons();
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    }

    const sidebar = document.getElementById('sidebar');
    let isSidebarOpen = window.innerWidth >= 768; 
    function toggleSidebar() {
        isSidebarOpen = !isSidebarOpen;
        if (isSidebarOpen) {
            sidebar.classList.remove('-translate-x-full');
        } else {
            sidebar.classList.add('-translate-x-full');
        }
        setTimeout(resize, 300); // Trigger canvas resize after sidebar animation
    }
    
    // --- Physics & Canvas Logic ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // State variables
    let isRunning = true;
    let time = 0;
    let dt = 1/60;
    let waveHistory = [];
    
    // Physics Parameters
    let A = 97;         
    let K = 15.00;      
    let T = 3.24;       

    // UI Elements bindings
    const aSlider = document.getElementById('ampSlider');
    const kSlider = document.getElementById('kSlider');
    const tSlider = document.getElementById('tSlider');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusText = document.getElementById('statusText');

    function updateControls(source = null) {
        A = parseFloat(aSlider.value);
        
        if (source === 'K') {
            K = parseFloat(kSlider.value);
            T = (4 * Math.PI) / Math.sqrt(K);
            tSlider.value = T;
        } else if (source === 'T') {
            T = parseFloat(tSlider.value);
            K = Math.pow((4 * Math.PI) / T, 2);
            if (K > 40) K = 40;
            if (K < 1) K = 1;
            kSlider.value = K;
        } else {
            K = parseFloat(kSlider.value);
            T = (4 * Math.PI) / Math.sqrt(K);
            tSlider.value = T;
        }

        document.getElementById('ampValue').innerText = Math.round(A);
        document.getElementById('kValue').innerText = K.toFixed(2);
        document.getElementById('tValue').innerText = T.toFixed(2) + "s";
    }

    [aSlider, kSlider, tSlider].forEach(slider => {
        slider.addEventListener('input', (e) => {
            if(e.target === aSlider) updateControls('A');
            else if(e.target === kSlider) updateControls('K');
            else updateControls('T');
        });
    });

    function resize() {
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => {
        if(window.innerWidth >= 768 && !isSidebarOpen) { toggleSidebar(); } 
        else if (window.innerWidth < 768 && isSidebarOpen) { toggleSidebar(); }
        resize();
    });

    // Interaction bindings
    pauseBtn.addEventListener('click', () => {
        isRunning = !isRunning;
        const isDark = document.documentElement.classList.contains('dark');
        
        pauseBtn.innerText = isRunning ? "PAUSE EXPERIMENT" : "RESUME EXPERIMENT";
        
        if (isRunning) {
            statusText.innerText = "ACTIVE";
            statusText.className = "text-orange-600 dark:text-indigo-400 font-bold";
            pauseBtn.className = "w-full py-3 bg-orange-100 text-orange-700 hover:bg-orange-200 border border-orange-200 dark:bg-indigo-500/20 dark:text-indigo-400 dark:border-indigo-500/30 dark:hover:bg-indigo-500/30 font-bold text-[11px] tracking-widest uppercase rounded-xl transition-all shadow-sm";
        } else {
            statusText.innerText = "PAUSED";
            statusText.className = "text-amber-500 font-bold";
            pauseBtn.className = "w-full py-3 bg-rose-100 text-rose-700 hover:bg-rose-200 border border-rose-200 dark:bg-rose-500/20 dark:text-rose-400 dark:border-rose-500/30 dark:hover:bg-rose-500/30 font-bold text-[11px] tracking-widest uppercase rounded-xl transition-all shadow-sm";
        }
    });

    resetBtn.addEventListener('click', () => {
        time = 0;
        waveHistory = [];
    });

    // Dynamic Theming Colors for Canvas
    function getColors() {
        const isDark = document.documentElement.classList.contains('dark');
        return {
            bg: isDark ? '#060B14' : '#f8fafc',
            grid: isDark ? 'rgba(255, 255, 255, 0.03)' : 'rgba(0, 0, 0, 0.05)',
            text: isDark ? 'rgba(148, 163, 184, 0.9)' : '#64748b',
            accent: isDark ? '#60A5FA' : '#ea580c', // Blue / Orange
            accentShadow: isDark ? 'rgba(96, 165, 250, 0.5)' : 'rgba(234, 88, 12, 0.3)',
            spring: isDark ? '#475569' : '#94a3b8',
            mass: isDark ? '#0F172A' : '#ffffff',
            wave: isDark ? '#818CF8' : '#f59e0b', // Indigo / Amber
            velVector: isDark ? '#10B981' : '#059669', // Emerald
            accVector: isDark ? '#F59E0B' : '#d97706', // Amber
        };
    }

    // Drawing loops and utilities
    function drawVector(ctx, startX, startY, endY, color, label) {
        const diff = endY - startY;
        if (Math.abs(diff) < 2) return; 
        
        const headlen = 5;
        const dir = diff < 0 ? -1 : 1; 
        
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX, endY);
        
        // Refined, sharper arrow heads
        ctx.lineTo(startX - 3.5, endY - dir * headlen);
        ctx.moveTo(startX, endY);
        ctx.lineTo(startX + 3.5, endY - dir * headlen);
        
        ctx.strokeStyle = color;
        ctx.lineWidth = 2; // Fixed thickness preventing the "fat" look
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.font = 'bold 11px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = dir < 0 ? 'bottom' : 'top';
        ctx.fillText(label, startX, endY + dir * 10);
    }

    function drawGrid(w, h, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        const gridSize = 40;
        for (let x = 0; x <= w; x += gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        for (let y = 0; y <= h; y += gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(w, y);
        }
        ctx.stroke();
    }

    function draw() {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        const c = getColors();
        
        ctx.fillStyle = c.bg;
        ctx.fillRect(0, 0, w, h);
        drawGrid(w, h, c.grid);

        const omega = Math.sqrt(K) * 0.5; 
        const phase = time * omega;
        const currentA = A;

        const yDisp = currentA * Math.sin(phase);
        const baseY = h / 2;
        const currentY = baseY + yDisp;

        // Dynamic layout based on screen width
        let phasorX = w * 0.20;
        let springX = w * 0.45;
        let waveStartX = w * 0.65;
        
        if (w < 600) { // Mobile layout adjustment
            phasorX = w * 0.25;
            springX = w * 0.75;
            waveStartX = w * 1.5; // Hide wave on extremely small screens
        }

        const waveSpeedX = 3; 

        if (isRunning) {
            waveHistory.unshift(currentY);
            const maxPoints = Math.ceil((w - waveStartX) / waveSpeedX) + 5;
            if (waveHistory.length > maxPoints) waveHistory.pop();
        }

        // 1. Connecting Dashed Line
        ctx.beginPath();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = c.accentShadow;
        ctx.lineWidth = 1.5;
        
        const dotX = phasorX - currentA * Math.cos(phase); 
        ctx.moveTo(dotX, currentY);
        ctx.lineTo(w < 600 ? springX : waveStartX, currentY);
        ctx.stroke();
        ctx.setLineDash([]); 

        // 2. Phasor (Circle) & Polar Grid
        const maxR = Math.max(0.1, currentA);
        
        ctx.strokeStyle = c.grid;
        ctx.lineWidth = 1;
        ctx.fillStyle = c.text; 
        ctx.font = '9px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const labelOffset = 18;

        ctx.beginPath();
        ctx.arc(phasorX, baseY, maxR / 2, 0, Math.PI * 2);
        ctx.stroke();

        for (let deg = 0; deg < 360; deg += 30) {
            const rad = deg * Math.PI / 180;
            const cosRad = Math.cos(rad);
            const sinRad = -Math.sin(rad); 

            ctx.beginPath();
            ctx.moveTo(phasorX, baseY);
            ctx.lineTo(phasorX + maxR * cosRad, baseY + maxR * sinRad);
            ctx.stroke();

            const labelX = phasorX + (maxR + labelOffset) * cosRad;
            const labelY = baseY + (maxR + labelOffset) * sinRad;
            ctx.fillText(`${deg}°`, labelX, labelY);
        }

        ctx.beginPath();
        ctx.arc(phasorX, baseY, maxR, 0, Math.PI * 2);
        ctx.strokeStyle = c.spring;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(phasorX, baseY, 3, 0, Math.PI * 2);
        ctx.fillStyle = c.accent;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(phasorX, baseY);
        ctx.lineTo(dotX, currentY);
        ctx.strokeStyle = c.accent;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(dotX, currentY, 5, 0, Math.PI * 2);
        ctx.fillStyle = c.accent;
        ctx.shadowColor = c.accent;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0; 

        // 3. Spring and Mass
        const topAnchorY = baseY - 200;
        const massSize = 40;
        const massTopY = currentY - massSize/2;

        ctx.beginPath();
        ctx.moveTo(springX, topAnchorY);
        ctx.lineTo(springX, topAnchorY + 20); 
        
        const numCoils = 14;
        const activeSpringH = massTopY - topAnchorY - 40;
        const step = activeSpringH / numCoils;
        const zigZagW = 16;
        
        for(let i=0; i<numCoils; i++) {
            let xOff = (i % 2 === 0) ? zigZagW : -zigZagW;
            ctx.lineTo(springX + xOff, topAnchorY + 20 + step * (i + 0.5));
        }
        
        ctx.lineTo(springX, massTopY - 20); 
        ctx.lineTo(springX, massTopY);
        
        ctx.strokeStyle = c.spring;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.rect(springX - massSize/2, currentY - massSize/2, massSize, massSize);
        ctx.fillStyle = c.mass;
        ctx.fill();
        ctx.strokeStyle = c.accent;
        ctx.lineWidth = 2;
        ctx.shadowColor = c.accentShadow;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0; 

        // Vector Overlay (Velocity & Acceleration)
        const v = currentA * omega * Math.cos(phase);
        const a = currentA * (-omega * omega) * Math.sin(phase);

        const vVisualScale = 0.4;
        const aVisualScale = 0.15;

        // Thin, sharp vectors
        drawVector(ctx, springX - 28, currentY, currentY + (v * vVisualScale), c.velVector, 'v');
        drawVector(ctx, springX + 28, currentY, currentY + (a * aVisualScale), c.accVector, 'a');

        // 4. The Wave (Hidden on very small screens)
        if (w >= 600 && waveHistory.length > 0) {
            ctx.beginPath();
            ctx.moveTo(waveStartX, waveHistory[0]);
            for (let i = 1; i < waveHistory.length; i++) {
                let x = waveStartX + i * waveSpeedX;
                ctx.lineTo(x, waveHistory[i]);
            }
            ctx.strokeStyle = c.wave;
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        if (isRunning) time += dt;
        requestAnimationFrame(draw);
    }

    // Init
    window.addEventListener('load', () => {
        applyThemeIcons();
        updateControls();
        resize();
        requestAnimationFrame(draw);
    });

</script>
</body>
</html>
