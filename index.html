    <style>
        :root {
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
            
            /* Light Mode - Warm Orange Spotlights (Boosted visibility) */
            --spotlight-color: rgba(249, 115, 22, 0.42);
            --global-spotlight: rgba(249, 115, 22, 0.22);
            --hover-shadow: 0 20px 40px -5px rgba(249, 115, 22, 0.15);
        }

        .dark {
            /* Dark Mode - Neon Indigo Spotlights */
            --spotlight-color: rgba(99, 102, 241, 0.18);
            --global-spotlight: rgba(99, 102, 241, 0.08);
            --hover-shadow: 0 20px 40px -5px rgba(99, 102, 241, 0.25);
        }

        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* ======================================================================
           UNIVERSAL 3D HOVER ENGINE & SPOTLIGHT 
         ====================================================================== 
        */
        .hover-3d {
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s var(--ease-smooth);
            transform-style: preserve-3d;
            perspective: 1200px;
            position: relative;
            will-change: transform;
            touch-action: manipulation;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            
            /* Stable Stacking Context Fixes */
            overflow: hidden;
            isolation: isolate;
            transform: translateZ(0);

            /* Prevent selections and copy-paste highlights */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        .hover-3d::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                var(--spotlight-color),
                transparent 65%
            );
            opacity: var(--spotlight-opacity, 0);
            transition: opacity 0.35s var(--ease-smooth);
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
        }
        
        .hover-3d:hover { box-shadow: var(--hover-shadow); }

        /* Global Ambient Glow Layer */
        #global-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                900px circle at var(--global-x, 50%) var(--global-y, 50%),
                var(--global-spotlight),
                transparent 70%
            );
            transition: opacity 0.5s ease;
        }

        /* ======================================================================
           COMPONENT STYLING
         ====================================================================== 
        */
        
        .smooth-transition {
            transition: all 0.5s var(--ease-smooth);
        }

        /* Accessibility Focus States */
        .chapter-card:focus-visible, .subject-tab:focus-visible {
            outline: 2px solid #f97316;
            outline-offset: 4px;
        }
        .dark .chapter-card:focus-visible, .dark .subject-tab:focus-visible {
            outline: 2px solid #818cf8;
        }

        .chapter-card {
            transition: border-color 0.4s var(--ease-smooth), background-color 0.4s var(--ease-smooth);
            text-align: left;
            width: 100%;
            transform-style: preserve-3d;
        }

        .chapter-card.planned {
            opacity: 0.5;
            filter: grayscale(85%);
            cursor: not-allowed;
            transition: opacity 0.4s var(--ease-smooth), filter 0.4s var(--ease-smooth);
        }
        .chapter-card.planned:hover {
            opacity: 0.7;
            filter: grayscale(40%);
        }

        .subject-tab {
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
        }
        .dark .subject-tab.active {
            background-color: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #818cf8;
            box-shadow: 0 0 20px -3px rgba(99, 102, 241, 0.4);
        }
        .light .subject-tab.active {
            background-color: rgba(249, 115, 22, 0.08);
            border-color: #ea580c;
            color: #ea580c;
            box-shadow: 0 8px 25px -5px rgba(249, 115, 22, 0.2);
        }

        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        .light .glass { background: rgba(255, 253, 250, 0.85); }

        .sim-list-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s var(--ease-smooth), background-color 0.4s var(--ease-smooth);
        }
        .sim-list-container.expanded { grid-template-rows: 1fr; }
        .sim-list-content { overflow: hidden; }

        .brand-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Display as inline-block and add padding to prevent italicized/extreme transforms from cutting off the letter 'D' */
        .brand-gradient {
            display: inline-block;
            padding-right: 0.08em; 
            user-select: none;
            -webkit-user-select: none;
        }

        .dark .brand-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .light .brand-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-logo-container {
            display: inline-block;
            border-radius: 2rem;
            padding: 1rem 3rem;
            background: transparent;
            overflow: visible !important; /* Forces bounding container to allow full tilted text graphics */
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ======================================================================
           GPU MERCY: REDUCED MOTION SUPPORT 
         ====================================================================== 
        */
        @media (prefers-reduced-motion: reduce) {
            .hover-3d {
                transition: none !important;
                transform: none !important;
                box-shadow: none !important;
            }
            .hover-3d::after, #global-glow, .absolute.inset-0.z-0 {
                display: none !important;
            }
            .smooth-transition, .chapter-card, .subject-tab, .sim-list-container {
                transition: none !important;
            }
            .glass {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                background: var(--tw-bg-opacity, 1) rgba(15, 23, 42, 0.98) !important;
            }
            .light .glass {
                background: rgba(255, 253, 250, 0.98) !important;
            }
        }
    </style>

    <script>
        // THE ONLY CHANGE: Dynamic Database Declaration
        let database = {}; 

        // State Management
        let currentSubject = 'physics';
        let currentTheme = localStorage.getItem('afeed_theme') || 'dark';

        // Utility: Debounce for Search Performance
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Apply Theme State
        function applyTheme() {
            const root = document.documentElement;
            const themeIconContainer = document.getElementById('theme-icon-container');
            
            if (currentTheme === 'dark') {
                root.classList.add('dark');
                root.classList.remove('light');
                if (themeIconContainer) {
                    themeIconContainer.innerHTML = `<i data-lucide="sun" class="w-5 h-5 text-amber-400"></i>`;
                }
            } else {
                root.classList.remove('dark');
                root.classList.add('light');
                if (themeIconContainer) {
                    themeIconContainer.innerHTML = `<i data-lucide="moon" class="w-5 h-5 text-orange-600"></i>`;
                }
            }
            localStorage.setItem('afeed_theme', currentTheme);
            lucide.createIcons();
        }

        window.toggleTheme = function() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme();
            renderApp();
        };

        window.switchSubject = function(subjectKey) {
            currentSubject = subjectKey;
            const searchBar = document.getElementById('searchBar');
            searchBar.value = ''; 
            renderApp();
            // Resync filtering logic to empty state after the DOM rebuilds
            searchBar.dispatchEvent(new Event('input'));
        };

        function getThemeClasses(themeColor) {
            const maps = {
                blue: { bg: 'bg-blue-50/80 dark:bg-blue-500/10', text: 'text-blue-600 dark:text-blue-400', border: 'border-blue-200 dark:border-blue-500/20', shadow: 'shadow-blue-500/5' },
                orange: { bg: 'bg-orange-50/80 dark:bg-orange-500/10', text: 'text-orange-600 dark:text-orange-400', border: 'border-orange-200 dark:border-orange-500/20', shadow: 'shadow-orange-500/5' },
                emerald: { bg: 'bg-emerald-50/80 dark:bg-emerald-500/10', text: 'text-emerald-600 dark:text-emerald-400', border: 'border-emerald-200 dark:border-emerald-500/20', shadow: 'shadow-emerald-500/5' },
                teal: { bg: 'bg-teal-50/80 dark:bg-teal-500/10', text: 'text-teal-600 dark:text-teal-400', border: 'border-teal-200 dark:border-teal-500/20', shadow: 'shadow-teal-500/5' },
                rose: { bg: 'bg-rose-50/80 dark:bg-rose-500/10', text: 'text-rose-600 dark:text-rose-400', border: 'border-rose-200 dark:border-rose-500/20', shadow: 'shadow-rose-500/5' },
                pink: { bg: 'bg-pink-50/80 dark:bg-pink-500/10', text: 'text-pink-600 dark:text-pink-400', border: 'border-pink-200 dark:border-pink-500/20', shadow: 'shadow-pink-500/5' },
                cyan: { bg: 'bg-cyan-50/80 dark:bg-cyan-500/10', text: 'text-cyan-600 dark:text-cyan-400', border: 'border-cyan-200 dark:border-cyan-500/20', shadow: 'shadow-cyan-500/5' }
            };
            return maps[themeColor] || maps.blue;
        }

        function getStatusBadge(status, simCount = 0, label = 'Labs') {
            const badgeIcon = label === 'Labs' ? 'flask-conical' : 'link';
            if (status === 'available') {
                return `<span class="bg-orange-50 dark:bg-indigo-500/10 text-orange-600 dark:text-indigo-400 text-[10px] px-2.5 py-1 rounded-md border border-orange-200 dark:border-indigo-500/20 font-bold uppercase tracking-wide flex items-center gap-1.5 shadow-sm smooth-transition">${simCount} Active ${label} <i data-lucide="${badgeIcon}" class="w-3.5 h-3.5"></i></span>`;
            } else if (status === 'partial') {
                return '<span class="bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-500 text-[10px] px-2.5 py-1 rounded-md border border-amber-200 dark:border-amber-500/20 font-bold uppercase tracking-wide smooth-transition">Partial</span>';
            }
            return '<span class="bg-slate-100 dark:bg-slate-800/80 text-slate-400 dark:text-slate-500 text-[10px] px-2.5 py-1 rounded-md border border-slate-200/60 dark:border-slate-700/50 font-bold uppercase tracking-wide smooth-transition">Planned</span>';
        }

        function saveExpandedState(id, isExpanded) {
            let expanded = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');
            if (isExpanded && !expanded.includes(id)) expanded.push(id);
            if (!isExpanded) expanded = expanded.filter(i => i !== id);
            localStorage.setItem('afeed_expanded', JSON.stringify(expanded));
        }

        window.trackRecentLearning = function(simTitle, simLink, chapterName) {
            let recent = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            recent = recent.filter(item => item.link !== simLink);
            recent.unshift({ title: simTitle, link: simLink, chapter: chapterName });
            if (recent.length > 4) recent.pop();
            localStorage.setItem('afeed_recent', JSON.stringify(recent));
        }

        // ======================================================================
        // DEDICATED ACCORDION CONTROLS
        // ======================================================================
        window.expandChapter = function(chapterId) {
            const container = document.getElementById(`sim-container-${chapterId}`);
            const chevron = document.getElementById(`chevron-${chapterId}`);
            const card = document.getElementById(`card-${chapterId}`);

            if (!container || container.classList.contains('expanded')) return;

            card.setAttribute('aria-expanded', 'true');
            container.classList.add('expanded');
            chevron.style.transform = 'rotate(180deg)';
            card.classList.add('bg-orange-50/40', 'dark:bg-slate-800/80', 'ring-1', 'ring-orange-500/50', 'dark:ring-indigo-500/50');
            card.classList.remove('bg-white', 'dark:bg-slate-900');
            
            saveExpandedState(chapterId, true);
        };

        window.collapseChapter = function(chapterId) {
            const container = document.getElementById(`sim-container-${chapterId}`);
            const chevron = document.getElementById(`chevron-${chapterId}`);
            const card = document.getElementById(`card-${chapterId}`);

            if (!container || !container.classList.contains('expanded')) return;

            card.setAttribute('aria-expanded', 'false');
            container.classList.remove('expanded');
            chevron.style.transform = 'rotate(0deg)';
            card.classList.remove('bg-orange-50/40', 'dark:bg-slate-800/80', 'ring-1', 'ring-orange-500/50', 'dark:ring-indigo-500/50');
            card.classList.add('bg-white', 'dark:bg-slate-900');
            
            saveExpandedState(chapterId, false);
        };

        window.toggleChapter = function(chapterId) {
            const container = document.getElementById(`sim-container-${chapterId}`);
            if (!container) return;
            
            if (container.classList.contains('expanded')) {
                collapseChapter(chapterId);
            } else {
                expandChapter(chapterId);
            }
        };

        // ACCESSIBILITY: Keyboard Interaction for semantic div buttons
        window.handleCardKeydown = function(event, chapterId) {
            if(event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleChapter(chapterId);
            }
        };

        function createCard(chapter, expandedState, itemLabel = 'Simulation') {
            const isAvailable = chapter.status === 'available' || chapter.status === 'partial';
            const isExpanded = expandedState.includes(chapter.id);
            const iconName = chapter.icon || 'file-text';
            const simCount = chapter.simulations ? chapter.simulations.length : 0;
            
            let simulationsHtml = '';
            if (simCount > 0) {
                simulationsHtml = chapter.simulations.map(sim => {
                    const targetAttr = sim.link.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : '';
                    return `
                    <a href="${sim.link}" ${targetAttr} tabindex="0" onclick="event.stopPropagation(); trackRecentLearning('${sim.title}', '${sim.link}', '${chapter.name}')" class="flex items-center justify-between p-3 mb-2 rounded-lg bg-white dark:bg-slate-950/80 border border-orange-100/50 dark:border-slate-800 hover:border-orange-400 dark:hover:border-indigo-400 hover:bg-orange-50/30 dark:hover:bg-slate-900 smooth-transition group relative z-10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-500 dark:focus-visible:outline-indigo-400">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-md bg-orange-50 dark:bg-indigo-500/10 flex items-center justify-center text-orange-600 dark:text-indigo-400 group-hover:bg-orange-600 dark:group-hover:bg-indigo-500 group-hover:text-white smooth-transition">
                                <i data-lucide="${targetAttr ? 'external-link' : 'play'}" class="w-3.5 h-3.5 ${targetAttr ? '' : 'ml-0.5'}"></i>
                            </div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-orange-700 dark:group-hover:text-white smooth-transition">${sim.title}</span>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 dark:text-slate-600 group-hover:text-orange-600 dark:group-hover:text-indigo-400 smooth-transition"></i>
                    </a>
                `}).join('');
            }

            const initialCardStyle = isExpanded ? 'bg-orange-50/40 dark:bg-slate-800/80 ring-1 ring-orange-500/50' : 'bg-white dark:bg-slate-900';
            
            // ACCESSIBILITY: Add button role, tabindex, and keyboard handlers
            const accessibilityAttrs = isAvailable ? 
                `role="button" tabindex="0" aria-expanded="${isExpanded}" onclick="toggleChapter('${chapter.id}')" onkeydown="handleCardKeydown(event, '${chapter.id}')"` : 
                `role="region" aria-disabled="true"`;

            const activeClass = isAvailable ? `active cursor-pointer border-orange-100/80 dark:border-slate-800 hover-3d ${initialCardStyle}` : 'planned bg-slate-50/50 dark:bg-slate-900/50 border-transparent';
            const initialExpandedClass = isExpanded ? 'expanded' : '';
            const chevronRotation = isExpanded ? 'transform: rotate(180deg)' : '';

            // DEEP SEARCH: Simulation titles are mapped and appended into the searchable metadata footprint
            const simulationTitles = chapter.simulations ? chapter.simulations.map(sim => sim.title).join(' ') : '';
            const searchMetadata = `${chapter.name} ${chapter.bn} ${chapter.keywords ? chapter.keywords.join(' ') : ''} ${simulationTitles}`.toLowerCase();

            return `
                <div id="card-${chapter.id}" class="chapter-card border rounded-2xl overflow-hidden ${activeClass}" 
                     data-search="${searchMetadata}" data-tilt="6" data-scale="1.025" ${accessibilityAttrs}>
                    <div class="p-5 flex flex-col justify-between h-full pointer-events-auto relative z-10">
                        <div>
                            <div class="flex justify-between items-start mb-5">
                                <div class="w-10 h-10 rounded-xl bg-orange-50/60 dark:bg-slate-800/80 flex items-center justify-center text-orange-600 dark:text-slate-300 shadow-inner smooth-transition">
                                    <i data-lucide="${iconName}" class="w-5 h-5"></i>
                                </div>
                                ${getStatusBadge(chapter.status, simCount, itemLabel === 'Simulation' ? 'Labs' : itemLabel + 's')}
                            </div>
                            <h3 class="text-lg text-slate-800 dark:text-white font-bold mb-1 smooth-transition">${chapter.name}</h3>
                            <p class="text-slate-500 dark:text-slate-400 text-sm mb-1 smooth-transition">${chapter.bn}</p>
                        </div>
                        
                        <div class="mt-4 flex items-center justify-between">
                            ${isAvailable ? 
                                `<span class="text-orange-600 dark:text-indigo-400 text-xs font-semibold uppercase tracking-wider smooth-transition">${simCount} ${itemLabel}${simCount > 1 ? 's' : ''}</span>
                                 <i id="chevron-${chapter.id}" data-lucide="chevron-down" class="w-4 h-4 text-orange-600 dark:text-indigo-400 smooth-transition" style="${chevronRotation}"></i>` : 
                                `<span class="text-slate-400 dark:text-slate-600 text-xs font-semibold uppercase tracking-wider smooth-transition">${itemLabel} Locked</span>`
                            }
                        </div>
                    </div>
                    ${isAvailable ? `
                    <div id="sim-container-${chapter.id}" class="sim-list-container bg-orange-50/10 dark:bg-slate-800/30 border-t border-orange-100 dark:border-slate-800/80 ${initialExpandedClass}" role="region" aria-label="Simulations for ${chapter.name}">
                        <div class="sim-list-content">
                            <div class="p-4 pt-3 relative z-20">
                                ${simulationsHtml}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function renderSubjectTabs() {
            const container = document.getElementById('subject-selector');
            let html = '';
            
            for (const [key, data] of Object.entries(database)) {
                const isActive = key === currentSubject;
                const activeClass = isActive ? 'active' : 'text-slate-600 dark:text-slate-400 border border-orange-100 dark:border-slate-700 bg-white dark:bg-slate-800/40 hover:bg-orange-50/50 dark:hover:bg-slate-800';
                
                // ACCESSIBILITY: Proper tab roles
                html += `
                    <button role="tab" aria-selected="${isActive}" onclick="switchSubject('${key}')" data-tilt="4" data-scale="1.05"
                            class="subject-tab hover-3d flex items-center gap-2 px-5 py-2.5 rounded-full font-semibold text-sm outline-none ${activeClass}">
                        <i data-lucide="${data.icon}" class="w-4 h-4 relative z-10"></i>
                        <span class="relative z-10">${data.name}</span>
                    </button>
                `;
            }
            container.innerHTML = html;
        }

        // ======================================================================
        // PAGE RENDER COMPOSITION
        // ======================================================================
        function renderApp() {
            renderSubjectTabs();

            const subjectData = database[currentSubject];
            const papersContainer = document.getElementById('papers-container');
            const navContainer = document.getElementById('dynamic-nav-links');
            const expandedState = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');

            let papersHtml = '';
            let navHtml = '';

            subjectData.papers.forEach((paper) => {
                const theme = getThemeClasses(paper.themeColor);
                
                navHtml += `<a href="#${paper.id}" class="hover:text-orange-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 smooth-transition relative z-10">${paper.title.split(' ')[paper.title.split(' ').length - 2] || ''} ${paper.title.split(' ')[paper.title.split(' ').length - 1] || paper.title}</a>`;

                papersHtml += `
                    <section id="${paper.id}" class="smooth-transition">
                        <div class="flex items-center gap-4 mb-8 hover-3d w-fit" data-tilt="12" data-scale="1.03">
                            <div class="w-12 h-12 rounded-xl ${theme.bg} flex items-center justify-center border ${theme.border} shadow-lg ${theme.shadow} smooth-transition relative z-10">
                                <i data-lucide="book-open" class="w-6 h-6 ${theme.text}"></i>
                            </div>
                            <div class="relative z-10">
                                <h2 class="text-3xl font-bold text-slate-800 dark:text-white tracking-tight smooth-transition">${paper.title}</h2>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 smooth-transition">${paper.bn}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start">
                            ${paper.chapters.map(ch => createCard(ch, expandedState, subjectData.itemLabel || 'Simulation')).join('')}
                        </div>
                    </section>
                `;
            });

            papersContainer.innerHTML = papersHtml;
            navContainer.innerHTML = navHtml;

            renderRecentModule();
            lucide.createIcons();
            
            // Wait for DOM paint to complete before calculating geometry for tilt effects
            requestAnimationFrame(() => {
                initGlobalHoverEngine(); 
            });
        }

        function renderRecentModule() {
            const recentItems = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            const container = document.getElementById('recent-module');
            const grid = document.getElementById('recent-grid');

            if (recentItems.length > 0) {
                container.classList.remove('hidden');
                grid.innerHTML = recentItems.map(item => {
                    const targetAttr = item.link.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : '';
                    return `
                    <a href="${item.link}" ${targetAttr} data-tilt="8" data-scale="1.03" class="hover-3d flex-none w-72 bg-white dark:bg-slate-800/60 border border-orange-100 dark:border-indigo-500/20 rounded-xl p-4 snap-start hover:bg-orange-50/30 dark:hover:bg-slate-800 smooth-transition group focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-500 dark:focus-visible:outline-indigo-400">
                        <div class="flex justify-between items-start mb-2 relative z-10">
                            <span class="text-xs font-bold text-orange-600 dark:text-indigo-400 uppercase tracking-wider smooth-transition">${item.chapter}</span>
                            <i data-lucide="${targetAttr ? 'external-link' : 'play-circle'}" class="w-4 h-4 text-slate-400 dark:text-slate-500 group-hover:text-orange-600 dark:group-hover:text-white smooth-transition"></i>
                        </div>
                        <h4 class="text-slate-800 dark:text-white font-semibold text-sm line-clamp-1 smooth-transition relative z-10">${item.title}</h4>
                    </a>
                `}).join('');
            } else {
                container.classList.add('hidden');
            }
        }

        // ======================================================================
        // SYSTEMIC HOVER & TILT ENGINE (Bulletproof Touch Stability)
        // ======================================================================
        function initGlobalHoverEngine() {
            // MOBILE FORM STABILIZATION: Strip 3D hover class from input wrappers if on touch devices
            if (window.matchMedia("(pointer: coarse)").matches) {
                const searchWrapper = document.getElementById('search-wrapper');
                if (searchWrapper) {
                    searchWrapper.classList.remove('hover-3d');
                }
            }

            const interactiveElements = document.querySelectorAll('.hover-3d');
            
            interactiveElements.forEach(el => {
                if(el.dataset.hoverEngineActive === "true") return;
                el.dataset.hoverEngineActive = "true";

                const maxTilt = parseFloat(el.getAttribute('data-tilt')) || 5;
                const activeScale = parseFloat(el.getAttribute('data-scale')) || 1.02;

                const resetHoverState = () => {
                    el.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    el.style.setProperty('--spotlight-opacity', '0');
                };

                // PREVENT DRAG EVENTS ON ACCIDENTAL MOUSE DRAG/SELECTION WHILST PRESS-HOLDING
                el.addEventListener('dragstart', (e) => {
                    e.preventDefault();
                });

                el.addEventListener('pointerenter', () => {
                    el.style.setProperty('--spotlight-opacity', '1');
                });

                el.addEventListener('pointermove', (e) => {
                    const rect = el.getBoundingClientRect();
                    let x = e.clientX - rect.left;
                    let y = e.clientY - rect.top;

                    if (e.pointerType === 'touch' && e.width === 1 && e.height === 1) {
                        x = rect.width / 2;
                        y = rect.height / 2;
                    }
                    
                    el.style.setProperty('--mouse-x', `${x}px`);
                    el.style.setProperty('--mouse-y', `${y}px`);
                    el.style.setProperty('--spotlight-opacity', '1');

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const tiltX = ((centerY - y) / centerY) * maxTilt;
                    const tiltY = ((x - centerX) / centerX) * maxTilt;

                    el.style.transform = `perspective(1200px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(${activeScale}, ${activeScale}, ${activeScale})`;
                });

                el.addEventListener('pointerdown', (e) => {
                    const rect = el.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    el.style.setProperty('--mouse-x', `${x}px`);
                    el.style.setProperty('--mouse-y', `${y}px`);
                    el.style.setProperty('--spotlight-opacity', '1');

                    el.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(${activeScale}, ${activeScale}, ${activeScale})`;
                });

                el.addEventListener('pointerleave', resetHoverState);
                el.addEventListener('pointercancel', resetHoverState);
            });
        }

        document.addEventListener('pointermove', (e) => {
            const body = document.body;
            body.style.setProperty('--global-x', `${e.clientX}px`);
            body.style.setProperty('--global-y', `${e.clientY}px`);
        });

        // PERFORMANCE: Debounced Live Search Logic with Auto-Expand Behavior
        document.getElementById('searchBar').addEventListener('input', debounce((e) => {
            const term = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.chapter-card').forEach(card => {
                const metadata = card.getAttribute('data-search');
                if (term === '' || metadata.includes(term)) {
                    card.style.display = ''; 
                    if (term !== '') expandChapter(card.id.replace('card-', ''));
                } else { card.style.display = 'none'; }
            });

            document.querySelectorAll('#papers-container section').forEach(sec => {
                let visibleCount = 0;
                sec.querySelectorAll('.chapter-card').forEach(c => { if (c.style.display !== 'none') visibleCount++; });
                sec.style.display = (visibleCount > 0 || term === '') ? '' : 'none';
            });
        }, 300));

        // NEW: Fetch Data.json on load with Offline Detection
        window.onload = async function() {
            applyTheme();
            
            // Check if device is completely offline
            if (!navigator.onLine) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('papers-container').innerHTML = `
                    <div class="text-center p-8 bg-orange-500/10 border border-orange-500/20 rounded-2xl">
                        <i data-lucide="wifi-off" class="w-10 h-10 text-orange-500 mx-auto mb-4 hover-3d" data-tilt="15" data-scale="1.1"></i>
                        <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-2">No Internet Connection</h2>
                        <p class="text-slate-600 dark:text-slate-400">Please connect to the internet to load AFEED OS.</p>
                        <button onclick="window.location.reload()" class="mt-6 px-6 py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-orange-500/20">Try Again</button>
                    </div>`;
                document.getElementById('papers-container').classList.remove('hidden');
                if(window.lucide) lucide.createIcons();
                initGlobalHoverEngine();
                return;
            }

            try {
                // Add timestamp query to bypass github pages aggressive cache
                const response = await fetch('data.json?v=' + new Date().getTime());
                if(!response.ok) throw new Error("Network response was not ok");
                
                database = await response.json();
                renderApp();
            } catch (error) {
                console.error("Failed to load database:", error);
                document.getElementById('loading-state').innerHTML = `
                    <div class="text-center p-8 bg-red-500/10 border border-red-500/20 rounded-2xl max-w-lg mx-auto">
                        <i data-lucide="alert-circle" class="w-10 h-10 text-red-500 mx-auto mb-4"></i>
                        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Database Missing</h2>
                        <p class="text-slate-600 dark:text-slate-400">Please ensure the <code>data.json</code> file exists in the repository root.</p>
                    </div>`;
                if(window.lucide) lucide.createIcons();
            }
        };
    </script>
</body>
</html>
